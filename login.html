<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingresar — FronteraDigital</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gov: { blue: '#003F8A', darkblue: '#002970', lightblue: '#0056B3', red: '#D40000' }
          },
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="font-sans bg-gray-50 min-h-screen flex flex-col">

  <!-- NAVBAR mínimo -->
  <nav class="bg-gov-blue shadow">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-2">
      <a href="index.html" class="flex items-center gap-2">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/>
        </svg>
        <span class="text-white font-bold">FronteraDigital</span>
      </a>
    </div>
  </nav>

  <!-- CONTENIDO -->
  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
      <!-- Card -->
      <div class="bg-white rounded-2xl shadow-lg p-8">
        <div class="text-center mb-8">
          <div class="w-16 h-16 bg-gov-blue rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
          </div>
          <h1 class="text-2xl font-bold text-gray-800">Iniciar sesión</h1>
          <p class="text-gray-500 text-sm mt-1">Ingresa con tu cuenta de FronteraDigital</p>
        </div>

        <!-- Mensaje de error -->
        <div id="error-msg" class="hidden bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-4 py-3 mb-5"></div>

        <!-- Formulario -->
        <form id="login-form" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico</label>
            <input type="email" id="email" required placeholder="correo@ejemplo.com"
              class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-gov-blue focus:border-transparent transition" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
            <div class="relative">
              <input type="password" id="password" required placeholder="••••••••"
                class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-gov-blue focus:border-transparent transition" />
              <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                <svg id="eye-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" id="submit-btn"
            class="w-full bg-gov-blue text-white font-semibold py-3 rounded-lg hover:bg-gov-lightblue transition flex items-center justify-center gap-2 mt-2">
            <span id="btn-text">Ingresar</span>
            <svg id="spinner" class="hidden w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
            </svg>
          </button>
        </form>

        <div class="mt-6 text-center text-sm text-gray-500">
          ¿No tienes cuenta?
          <a href="registro.html" class="text-gov-blue font-semibold hover:underline">Regístrate aquí</a>
        </div>
      </div>
    </div>
  </main>

  <!-- JS -->
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function togglePassword() {
      const input = document.getElementById('password')
      input.type = input.type === 'password' ? 'text' : 'password'
    }

    function setLoading(loading) {
      const btn = document.getElementById('submit-btn')
      const spinner = document.getElementById('spinner')
      const btnText = document.getElementById('btn-text')
      btn.disabled = loading
      spinner.classList.toggle('hidden', !loading)
      btnText.textContent = loading ? 'Ingresando...' : 'Ingresar'
    }

    function showError(msg) {
      const el = document.getElementById('error-msg')
      el.textContent = msg
      el.classList.remove('hidden')
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault()
      document.getElementById('error-msg').classList.add('hidden')
      setLoading(true)

      const email = document.getElementById('email').value.trim()
      const password = document.getElementById('password').value

      try {
        await login(email, password)
        // login() redirige automáticamente
      } catch (err) {
        setLoading(false)
        const msg = err.message?.includes('Invalid login') || err.message?.includes('invalid')
          ? 'Correo o contraseña incorrectos.'
          : err.message || 'Error al iniciar sesión.'
        showError(msg)
      }
    })

    // Si ya está logueado, redirigir
    ;(async () => {
      const user = await getCurrentUser()
      if (user) {
        if (user.profile?.tipo_usuario === 'funcionario') {
          window.location.href = 'panel-funcionario.html'
        } else {
          window.location.href = 'pre-registro.html'
        }
      }
    })()
  </script>
</body>
</html>
