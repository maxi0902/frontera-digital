<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrarse — FronteraDigital</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gov: { blue: '#003F8A', darkblue: '#002970', lightblue: '#0056B3', red: '#D40000' }
          },
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="font-sans bg-gray-50 min-h-screen flex flex-col">

  <nav class="bg-gov-blue shadow">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-2">
      <a href="index.html" class="flex items-center gap-2">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/>
        </svg>
        <span class="text-white font-bold">FronteraDigital</span>
      </a>
    </div>
  </nav>

  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-lg">
      <div class="bg-white rounded-2xl shadow-lg p-8">
        <div class="text-center mb-8">
          <div class="w-16 h-16 bg-gov-blue rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
            </svg>
          </div>
          <h1 class="text-2xl font-bold text-gray-800">Crear cuenta</h1>
          <p class="text-gray-500 text-sm mt-1">Completa tus datos para registrarte</p>
        </div>

        <!-- Error / Éxito -->
        <div id="error-msg" class="hidden bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-4 py-3 mb-5"></div>
        <div id="success-msg" class="hidden bg-green-50 border border-green-200 text-green-700 text-sm rounded-lg px-4 py-3 mb-5"></div>

        <form id="registro-form" class="space-y-4">

          <!-- Tipo de usuario -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Tipo de usuario</label>
            <div class="grid grid-cols-2 gap-3">
              <label class="cursor-pointer">
                <input type="radio" name="tipo_usuario" value="pasajero" checked class="sr-only peer" />
                <div class="border-2 border-gray-200 peer-checked:border-gov-blue peer-checked:bg-blue-50 rounded-lg p-3 text-center transition">
                  <svg class="w-6 h-6 mx-auto mb-1 text-gray-400 peer-checked:text-gov-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                  </svg>
                  <span class="text-sm font-medium text-gray-700">Pasajero</span>
                </div>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="tipo_usuario" value="funcionario" class="sr-only peer" />
                <div class="border-2 border-gray-200 peer-checked:border-gov-blue peer-checked:bg-blue-50 rounded-lg p-3 text-center transition">
                  <svg class="w-6 h-6 mx-auto mb-1 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                  </svg>
                  <span class="text-sm font-medium text-gray-700">Funcionario</span>
                </div>
              </label>
            </div>
          </div>

          <!-- Datos personales -->
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
              <input type="text" id="nombre" required placeholder="Juan"
                class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-gov-blue transition" />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Apellido</label>
              <input type="text" id="apellido" required placeholder="Pérez"
                class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-gov-blue transition" />
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">RUT</label>
            <input type="text" id="rut" required placeholder="12.345.678-9"
              class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-gov-blue transition" />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico</label>
            <input type="email" id="email" required placeholder="correo@ejemplo.com"
              class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-gov-blue transition" />
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
              <input type="password" id="password" required placeholder="••••••••" minlength="6"
                class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-gov-blue transition" />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Confirmar</label>
              <input type="password" id="confirm-password" required placeholder="••••••••"
                class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-gov-blue transition" />
            </div>
          </div>

          <!-- Campos solo para funcionarios -->
          <div id="campos-funcionario" class="hidden space-y-4 pt-2 border-t border-gray-100">
            <p class="text-xs font-semibold text-gov-blue uppercase tracking-wide">Datos del funcionario</p>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Organismo</label>
              <select id="organismo"
                class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-gov-blue transition bg-white">
                <option value="">Seleccionar...</option>
                <option value="aduana">Aduana</option>
                <option value="pdi">PDI</option>
                <option value="sag">SAG</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">N° de empleado</label>
              <input type="text" id="numero-empleado" placeholder="EMP-00123"
                class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-gov-blue transition" />
            </div>
          </div>

          <button type="submit" id="submit-btn"
            class="w-full bg-gov-blue text-white font-semibold py-3 rounded-lg hover:bg-gov-lightblue transition flex items-center justify-center gap-2 mt-2">
            <span id="btn-text">Crear cuenta</span>
            <svg id="spinner" class="hidden w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
            </svg>
          </button>
        </form>

        <div class="mt-6 text-center text-sm text-gray-500">
          ¿Ya tienes cuenta?
          <a href="login.html" class="text-gov-blue font-semibold hover:underline">Inicia sesión</a>
        </div>
      </div>
    </div>
  </main>

  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Mostrar/ocultar campos de funcionario
    document.querySelectorAll('input[name="tipo_usuario"]').forEach(radio => {
      radio.addEventListener('change', () => {
        const isFuncionario = radio.value === 'funcionario' && radio.checked
        document.getElementById('campos-funcionario').classList.toggle('hidden', !isFuncionario)
        document.getElementById('organismo').required = isFuncionario
        document.getElementById('numero-empleado').required = isFuncionario
      })
    })

    function setLoading(loading) {
      const btn = document.getElementById('submit-btn')
      const spinner = document.getElementById('spinner')
      const btnText = document.getElementById('btn-text')
      btn.disabled = loading
      spinner.classList.toggle('hidden', !loading)
      btnText.textContent = loading ? 'Creando cuenta...' : 'Crear cuenta'
    }

    function showError(msg) {
      const el = document.getElementById('error-msg')
      el.textContent = msg
      el.classList.remove('hidden')
      document.getElementById('success-msg').classList.add('hidden')
    }

    function showSuccess(msg) {
      const el = document.getElementById('success-msg')
      el.textContent = msg
      el.classList.remove('hidden')
      document.getElementById('error-msg').classList.add('hidden')
    }

    document.getElementById('registro-form').addEventListener('submit', async (e) => {
      e.preventDefault()
      document.getElementById('error-msg').classList.add('hidden')

      const password = document.getElementById('password').value
      const confirm = document.getElementById('confirm-password').value
      if (password !== confirm) return showError('Las contraseñas no coinciden.')

      const tipoUsuario = document.querySelector('input[name="tipo_usuario"]:checked').value

      setLoading(true)
      try {
        await register({
          email: document.getElementById('email').value.trim(),
          password,
          nombre: document.getElementById('nombre').value.trim(),
          apellido: document.getElementById('apellido').value.trim(),
          rut: document.getElementById('rut').value.trim(),
          tipo_usuario: tipoUsuario,
          organismo: document.getElementById('organismo').value || null,
          numero_empleado: document.getElementById('numero-empleado').value.trim() || null,
        })

        showSuccess('Cuenta creada correctamente. Redirigiendo...')
        setTimeout(() => {
          window.location.href = tipoUsuario === 'funcionario'
            ? 'panel-funcionario.html'
            : 'pre-registro.html'
        }, 1500)
      } catch (err) {
        setLoading(false)
        const msg = err.message?.includes('already registered')
          ? 'Este correo ya está registrado.'
          : err.message || 'Error al crear la cuenta.'
        showError(msg)
      }
    })
  </script>
</body>
</html>
